name = "lantana"
version = "0.1.0"
defaultTargets = ["Lantana"]
testDriver = "LantanaTest"

# Transfinite Iris-Lean: the `Iris/` package of dongjaelee1/iris-lean, branch `transfinite`,
# whose committed step-index choice is the ordinal one (`Iris.SI := Ordinal.{3}`). The
# `ordinals` package comes with it (a path dependency inside that repository).
[[require]]
name = "iris"
git = "https://github.com/dongjaelee1/iris-lean"
rev = "fdc7402f0997659bbdd366f302ceb455358942f8"
subDir = "Iris"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
# Built-in linters, as in Iris-Lean's lakefile (lake options are not inherited downstream).
linter.missingDocs = false
linter.omit = false
linter.redundantVisibility = true
linter.loopingSimpArgs = false
linter.extra.unreachableTactic = true
linter.extra.unnecessarySeqFocus = true
linter.extra.unusedDecidableInType = false
# Iris-Lean's own linters (Iris.Std.Linter), same settings as Iris.
weak.linter.iris.docPrime = false
weak.linter.iris.style.setOption = false
weak.linter.iris.style.missingEnd = true
weak.linter.iris.style.cdot = true
weak.linter.iris.style.dollarSyntax = true
weak.linter.iris.style.lambdaSyntax = true
weak.linter.iris.style.longLine = false
weak.linter.iris.style.nameCheck = true
weak.linter.iris.style.openClassical = true
weak.linter.iris.style.show = true
weak.linter.iris.dupNamespace = true
weak.linter.iris.style.whitespace = true

[[lean_lib]]
name = "Lantana"

[[lean_lib]]
name = "LantanaTest"
globs = ["LantanaTest.+"]
